# Se define la red
networks:
  laravel_network:
    driver: bridge

# Crear volumenes para las DBs
volumes:
  db_serve1_data:
    driver: local
  db_serve2_data:
    driver: local
  db_serve3_data:
    driver: local
  react_node_modules:
    driver: local
  kafka_data:
    driver: local

services:
  # Servicio PostgreSQL
  db_server1:
    image: postgres:13 # servicio:version nombre de la imagen a utilizar
    container_name: db_server1
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: auth_db # Nombre de la DB
    ports:
      - "5450:5432"
    volumes:
      - db_serve1_data:/var/lib/postgresql/data # Nombre dek volume correspondiente
    networks:
      - laravel_network

  # Servicio Mysql
  db_server3:
    image: mysql:8.0 # servicio:version nombre de la imagen a utilizar
    container_name: db_server3
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: task_db
      MYSQL_PASSWORD: root
    ports:
      - "3311:3306"
    volumes:
      - db_serve2_data:/var/lib/mysql # Nombre dek volume correspondiente
    networks:
      - laravel_network

  auth-service:
    build:
      context: ./laravel-jwt-api-starter-main
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8080:80"
    working_dir: /var/www/html
    # temporal para pruebas
    volumes:
      - ./laravel-jwt-api-starter-main:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_KEY: base64:qmprkpImFZnb1i47fFzUoMOEllVC6Ski15JCytKZsQc=
      DB_HOST: db_server1
      DB_CONNECTION: pgsql
      DB_PORT: 5432
      DB_DATABASE: auth_db
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_ALGO: RS256
      JWT_TTL: 60
      JWT_PASSPHRASE: null
      JWT_ISSUER: auth-service
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - db_server1
    networks:
      - laravel_network

  task-service:
    build:
      context: ./laravel-task-api
      dockerfile: Dockerfile
    container_name: task-service
    restart: unless-stopped
    ports:
      - "8081:80"
    working_dir: /var/www/html
    volumes:
      - ./laravel-task-api:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_KEY: base64:xvA0aDWjp1Dp9HX112yU9giTtJdU8ZFe+iKK+Y6VZGE=
      DB_HOST: db_server3
      DB_CONNECTION: mysql
      DB_PORT: 3306
      DB_DATABASE: task_db
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_ALGO: RS256
      JWT_TTL: 60
      JWT_ISSUER: auth-service
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - db_server3
    networks:
      - laravel_network

  react-auth:
    image: node:20
    container_name: react-auth
    working_dir: /app
    volumes:
      - ./react-auth:/app
      - react_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - laravel_network
    depends_on:
      - auth-service

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Listener interno Docker + externo desde tu máquina
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Configuración básica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - laravel_network