
name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # DOCKER VERSION
      # ============================================================
      - name: Docker version
        run: |
          docker --version
          docker compose version


      # ============================================================
      # PREPARE JWT KEYS
      # ============================================================
      - name: Prepare JWT keys
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
        run: |
          set -e

          mkdir -p ci-keys/auth
          mkdir -p ci-keys/task

          printf '%s\n' "$JWT_PRIVATE_KEY" \
            | sed 's/\r$//' \
            > ci-keys/auth/jwt-private.pem

          printf '%s\n' "$JWT_PUBLIC_KEY" \
            | sed 's/\r$//' \
            > ci-keys/auth/jwt-public.pem

          cp \
            ci-keys/auth/jwt-public.pem \
            ci-keys/task/jwt-public.pem

          chmod 644 ci-keys/auth/jwt-private.pem
          chmod 644 ci-keys/auth/jwt-public.pem
          chmod 644 ci-keys/task/jwt-public.pem

          test -s ci-keys/auth/jwt-private.pem
          test -s ci-keys/auth/jwt-public.pem
          test -s ci-keys/task/jwt-public.pem

          echo "JWT keys created successfully."


      # ============================================================
      # VALIDATE JWT PRIVATE KEY
      # ============================================================
      - name: Validate JWT private key
        run: |
          set -e

          openssl rsa \
            -in ci-keys/auth/jwt-private.pem \
            -check \
            -noout

          echo "JWT private key is valid."


      # ============================================================
      # PREPARE AUTH .ENV
      # ============================================================
      - name: Prepare Auth .env
        run: |
          set -e

          cat > ci-keys/auth/.env <<'EOF'
          APP_NAME=AuthService
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost

          LOG_CHANNEL=stderr
          LOG_LEVEL=debug

          DB_CONNECTION=pgsql
          DB_HOST=db_server1
          DB_PORT=5432
          DB_DATABASE=auth_db
          DB_USERNAME=root
          DB_PASSWORD=root

          JWT_ALGO=RS256
          JWT_TTL=60
          JWT_PASSPHRASE=
          JWT_ISSUER=auth-service
          EOF

          test -s ci-keys/auth/.env

          echo "Auth .env created."


      # ============================================================
      # PREPARE TASK .ENV
      # ============================================================
      - name: Prepare Task .env
        run: |
          set -e

          cat > ci-keys/task/.env <<'EOF'
          APP_NAME=TaskService
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost

          LOG_CHANNEL=stderr
          LOG_LEVEL=debug

          DB_CONNECTION=mysql
          DB_HOST=db_server3
          DB_PORT=3306
          DB_DATABASE=task_db
          DB_USERNAME=root
          DB_PASSWORD=root

          JWT_ALGO=RS256
          JWT_TTL=60
          JWT_ISSUER=auth-service
          EOF

          test -s ci-keys/task/.env

          echo "Task .env created."


      # ============================================================
      # BUILD DOCKER IMAGES
      # ============================================================
      - name: Build Docker images
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            build


      # ============================================================
      # START DATABASES
      # ============================================================
      - name: Start databases
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            up -d \
            db_server1 \
            db_server3


      # ============================================================
      # WAIT FOR DATABASES
      # ============================================================
      - name: Wait for databases
        run: |
          set -e

          echo "Waiting for PostgreSQL..."

          until docker compose \
            -f docker-compose.ci.yml \
            exec -T db_server1 \
            pg_isready -U root -d auth_db
          do
            sleep 2
          done

          echo "PostgreSQL is ready."

          echo "Waiting for MySQL..."

          until docker compose \
            -f docker-compose.ci.yml \
            exec -T db_server3 \
            mysqladmin ping \
              -h localhost \
              -uroot \
              -proot
          do
            sleep 2
          done

          echo "MySQL is ready."


      # ============================================================
      # START LARAVEL SERVICES
      # ============================================================
      #
      # Los .env y las claves YA existen en los volúmenes antes
      # de arrancar estos contenedores.
      #
      # ============================================================
      - name: Start Laravel services
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            up -d \
            auth-service \
            task-service


      # ============================================================
      # START REACT
      # ============================================================
      - name: Start React
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            up -d \
            react-auth


      # ============================================================
      # SHOW CONTAINERS
      # ============================================================
      - name: Docker containers
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            ps


      # ============================================================
      # VERIFY AUTH JWT FILES
      # ============================================================
      - name: Verify Auth JWT keys
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            sh -c '
              echo "JWT directory:"
              ls -la /var/www/html/storage/keys

              test -f /var/www/html/storage/keys/jwt-private.pem
              test -f /var/www/html/storage/keys/jwt-public.pem

              echo "Auth JWT keys are available."
            '


      # ============================================================
      # VERIFY TASK JWT FILE
      # ============================================================
      - name: Verify Task JWT key
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            sh -c '
              echo "JWT directory:"
              ls -la /var/www/html/storage/keys

              test -f /var/www/html/storage/keys/jwt-public.pem

              echo "Task JWT public key is available."
            '


      # ============================================================
      # VERIFY AUTH .ENV
      # ============================================================
      - name: Verify Auth .env
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            sh -c '
              test -s /var/www/html/.env
              echo "Auth .env exists."
            '


      # ============================================================
      # VERIFY TASK .ENV
      # ============================================================
      - name: Verify Task .env
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            sh -c '
              test -s /var/www/html/.env
              echo "Task .env exists."
            '


      # ============================================================
      # GENERATE AUTH APP KEY
      # ============================================================
      - name: Generate Auth APP_KEY
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            php artisan key:generate --force


      # ============================================================
      # GENERATE TASK APP KEY
      # ============================================================
      - name: Generate Task APP_KEY
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            php artisan key:generate --force


      # ============================================================
      # INSTALL AUTH DEPENDENCIES
      # ============================================================
      - name: Install Auth dependencies
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            composer install \
              --no-interaction \
              --prefer-dist \
              --no-progress \
              --optimize-autoloader


      # ============================================================
      # INSTALL TASK DEPENDENCIES
      # ============================================================
      - name: Install Task dependencies
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            composer install \
              --no-interaction \
              --prefer-dist \
              --no-progress \
              --optimize-autoloader


      # ============================================================
      # CLEAR LARAVEL CACHE
      # ============================================================
      - name: Clear Laravel cache
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            php artisan optimize:clear

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            php artisan optimize:clear


      # ============================================================
      # AUTH MIGRATION STATUS
      # ============================================================
      - name: Auth migration status
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            php artisan migrate:status


      # ============================================================
      # AUTH MIGRATIONS
      # ============================================================
      - name: Auth migrations
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            php artisan migrate --force


      # ============================================================
      # TASK MIGRATION STATUS
      # ============================================================
      - name: Task migration status
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            php artisan migrate:status


      # ============================================================
      # TASK MIGRATIONS
      # ============================================================
      - name: Task migrations
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            php artisan migrate --force


      # ============================================================
      # AUTH TESTS
      # ============================================================
      - name: Run Auth tests
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            php artisan test -v


      # ============================================================
      # TASK TESTS
      # ============================================================
      - name: Run Task tests
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            php artisan test -v


      # ============================================================
      # INSTALL REACT DEPENDENCIES
      # ============================================================
      - name: Install React dependencies
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T react-auth \
            npm ci


      # ============================================================
      # BUILD REACT
      # ============================================================
      - name: Build React
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T react-auth \
            npm run build


      # ============================================================
      # SHOW LOGS IF FAILURE
      # ============================================================
      - name: Show Docker logs
        if: failure()
        run: |
          echo "=========================================="
          echo "DOCKER CONTAINERS"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            ps

          echo "=========================================="
          echo "AUTH SERVICE"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            logs auth-service

          echo "=========================================="
          echo "TASK SERVICE"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            logs task-service

          echo "=========================================="
          echo "POSTGRES"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            logs db_server1

          echo "=========================================="
          echo "MYSQL"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            logs db_server3

          echo "=========================================="
          echo "REACT"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            logs react-auth


      # ============================================================
      # SHUTDOWN
      # ============================================================
      - name: Shutdown
        if: always()
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            down -v

          rm -rf ci-keys