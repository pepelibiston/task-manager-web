name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ============================================================
  # BUILD AND TEST
  # ============================================================
  test:

    name: Build and Test

    runs-on: ubuntu-latest


    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # DOCKER VERSION
      # ========================================================
      - name: Docker version
        run: |
          docker --version
          docker compose version


      # ========================================================
      # CREATE JWT KEYS
      # ========================================================
      #
      # Las claves NO están en Git.
      #
      # GitHub Secrets:
      #   JWT_PRIVATE_KEY
      #   JWT_PUBLIC_KEY
      #
      # Auth necesita:
      #   jwt-private.pem
      #   jwt-public.pem
      #
      # Task necesita:
      #   jwt-public.pem
      #
      # ========================================================
      - name: Prepare JWT keys
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
        run: |
          set -e

          mkdir -p ci-keys/auth
          mkdir -p ci-keys/task

          printf '%s\n' "$JWT_PRIVATE_KEY" \
            > ci-keys/auth/jwt-private.pem

          printf '%s\n' "$JWT_PUBLIC_KEY" \
            > ci-keys/auth/jwt-public.pem

          cp ci-keys/auth/jwt-public.pem \
            ci-keys/task/jwt-public.pem

          # Permisos compatibles con PHP/Apache dentro del contenedor
          chmod 644 ci-keys/auth/jwt-private.pem
          chmod 644 ci-keys/auth/jwt-public.pem
          chmod 644 ci-keys/task/jwt-public.pem

          echo "JWT files created:"
          ls -la ci-keys/auth
          ls -la ci-keys/task


      # ========================================================
      # VALIDATE JWT KEYS
      # ========================================================
      - name: Validate JWT keys
        run: |
          set -e

          test -s ci-keys/auth/jwt-private.pem
          test -s ci-keys/auth/jwt-public.pem
          test -s ci-keys/task/jwt-public.pem

          openssl rsa \
            -in ci-keys/auth/jwt-private.pem \
            -check \
            -noout

          openssl pkey \
            -in ci-keys/auth/jwt-private.pem \
            -pubout \
            -out /tmp/generated-public.pem

          diff \
            /tmp/generated-public.pem \
            ci-keys/auth/jwt-public.pem

          echo "JWT keys are valid and match."


      # ========================================================
      # BUILD DOCKER IMAGES
      # ========================================================
      #
      # IMPORTANTE:
      # Los Dockerfiles NO deben ejecutar composer install.
      #
      # Composer se ejecutará después de crear .env y montar
      # las claves JWT.
      #
      # ========================================================
      - name: Build Docker images
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            build


      # ========================================================
      # START DATABASES AND SERVICES
      # ========================================================
      - name: Start Docker services
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            up -d


      # ========================================================
      # SHOW CONTAINERS
      # ========================================================
      - name: Docker containers
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            ps


      # ========================================================
      # VERIFY JWT KEYS INSIDE CONTAINERS
      # ========================================================
      - name: Verify JWT keys inside containers
        run: |
          set -e

          echo "=========================================="
          echo "AUTH SERVICE KEYS"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            sh -c '
              pwd
              ls -la /var/www/html/storage
              ls -la /var/www/html/storage/keys
              test -f /var/www/html/storage/keys/jwt-private.pem
              test -f /var/www/html/storage/keys/jwt-public.pem
            '

          echo "=========================================="
          echo "TASK SERVICE KEYS"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            sh -c '
              pwd
              ls -la /var/www/html/storage
              ls -la /var/www/html/storage/keys
              test -f /var/www/html/storage/keys/jwt-public.pem
            '


      # ========================================================
      # CREATE AUTH .ENV
      # ========================================================
      - name: Create Auth .env
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            sh -c 'cat > /var/www/html/.env <<EOF
          APP_NAME=AuthService
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost

          LOG_CHANNEL=stderr
          LOG_LEVEL=debug

          DB_CONNECTION=pgsql
          DB_HOST=db_server1
          DB_PORT=5432
          DB_DATABASE=auth_db
          DB_USERNAME=root
          DB_PASSWORD=root

          JWT_ALGO=RS256
          JWT_TTL=60
          JWT_PASSPHRASE=
          JWT_ISSUER=auth-service
          EOF'

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            sh -c 'test -f /var/www/html/.env'


      # ========================================================
      # CREATE TASK .ENV
      # ========================================================
      - name: Create Task .env
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            sh -c 'cat > /var/www/html/.env <<EOF
          APP_NAME=TaskService
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost

          LOG_CHANNEL=stderr
          LOG_LEVEL=debug

          DB_CONNECTION=mysql
          DB_HOST=db_server3
          DB_PORT=3306
          DB_DATABASE=task_db
          DB_USERNAME=root
          DB_PASSWORD=root

          JWT_ALGO=RS256
          JWT_TTL=60
          JWT_ISSUER=auth-service
          EOF'

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            sh -c 'test -f /var/www/html/.env'


      # ========================================================
      # INSTALL AUTH COMPOSER DEPENDENCIES
      # ========================================================
      #
      # AQUÍ ya existen:
      #   - .env
      #   - jwt-private.pem
      #   - jwt-public.pem
      #
      # Por tanto Laravel puede cargar config/jwt.php.
      #
      # ========================================================
      - name: Install Auth dependencies
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --optimize-autoloader


      # ========================================================
      # INSTALL TASK COMPOSER DEPENDENCIES
      # ========================================================
      - name: Install Task dependencies
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --optimize-autoloader


      # ========================================================
      # GENERATE AUTH APP KEY
      # ========================================================
      - name: Generate Auth APP_KEY
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            php artisan key:generate --force


      # ========================================================
      # GENERATE TASK APP KEY
      # ========================================================
      - name: Generate Task APP_KEY
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            php artisan key:generate --force


      # ========================================================
      # CLEAR LARAVEL CACHE
      # ========================================================
      - name: Clear Laravel cache
        run: |

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            php artisan optimize:clear

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            php artisan optimize:clear


      # ========================================================
      # AUTH MIGRATION STATUS
      # ========================================================
      - name: Auth migration status
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            php artisan migrate:status


      # ========================================================
      # AUTH MIGRATIONS
      # ========================================================
      - name: Auth migrations
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            php artisan migrate --force


      # ========================================================
      # TASK MIGRATION STATUS
      # ========================================================
      - name: Task migration status
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            php artisan migrate:status


      # ========================================================
      # TASK MIGRATIONS
      # ========================================================
      - name: Task migrations
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            php artisan migrate --force


      # ========================================================
      # AUTH TESTS
      # ========================================================
      - name: Run Auth tests
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            php artisan test -v


      # ========================================================
      # TASK TESTS
      # ========================================================
      - name: Run Task tests
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            php artisan test -v


      # ========================================================
      # INSTALL REACT DEPENDENCIES
      # ========================================================
      - name: Install React dependencies
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            exec -T react-auth \
            npm ci


      # ========================================================
      # BUILD REACT
      # ========================================================
      - name: Build React
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            exec -T react-auth \
            npm run build


      # ========================================================
      # FAILURE LOGS
      # ========================================================
      - name: Show Docker logs
        if: failure()
        run: |

          echo "=========================================="
          echo "CONTAINERS"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            ps

          echo "=========================================="
          echo "AUTH SERVICE"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            logs auth-service

          echo "=========================================="
          echo "TASK SERVICE"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            logs task-service

          echo "=========================================="
          echo "POSTGRES"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            logs db_server1

          echo "=========================================="
          echo "MYSQL"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            logs db_server3

          echo "=========================================="
          echo "AUTH LARAVEL LOG"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            sh -c 'cat storage/logs/laravel.log 2>/dev/null || true'

          echo "=========================================="
          echo "TASK LARAVEL LOG"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            sh -c 'cat storage/logs/laravel.log 2>/dev/null || true'


      # ========================================================
      # CLEANUP
      # ========================================================
      - name: Shutdown
        if: always()
        run: |

          docker compose \
            -f docker-compose.ci.yml \
            down -v

          rm -rf ci-keys