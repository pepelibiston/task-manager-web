name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ============================================================
  # BUILD AND TEST
  # ============================================================
  test:

    name: Build and Test

    runs-on: ubuntu-latest


    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # DOCKER VERSION
      # ========================================================
      - name: Docker version
        run: |
          docker --version
          docker compose version


      # ========================================================
      # PREPARE JWT KEYS
      # ========================================================
      #
      # Las claves NO están almacenadas en Git.
      #
      # GitHub Secrets:
      #
      #   JWT_PRIVATE_KEY
      #   JWT_PUBLIC_KEY
      #
      # Auth:
      #
      #   jwt-private.pem
      #   jwt-public.pem
      #
      # Task:
      #
      #   jwt-public.pem
      #
      # ========================================================
      - name: Prepare JWT keys
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}

        run: |
          set -e

          echo "Creating JWT directories..."

          mkdir -p ci-keys/auth
          mkdir -p ci-keys/task

          echo "Creating private key..."

          printf '%s\n' "$JWT_PRIVATE_KEY" \
            | sed 's/\r$//' \
            > ci-keys/auth/jwt-private.pem

          echo "Creating public key..."

          printf '%s\n' "$JWT_PUBLIC_KEY" \
            | sed 's/\r$//' \
            > ci-keys/auth/jwt-public.pem

          echo "Copying public key to task-service..."

          cp \
            ci-keys/auth/jwt-public.pem \
            ci-keys/task/jwt-public.pem

          chmod 644 ci-keys/auth/jwt-private.pem
          chmod 644 ci-keys/auth/jwt-public.pem
          chmod 644 ci-keys/task/jwt-public.pem

          echo "Checking JWT files..."

          test -s ci-keys/auth/jwt-private.pem
          test -s ci-keys/auth/jwt-public.pem
          test -s ci-keys/task/jwt-public.pem

          echo "JWT files created successfully."


      # ========================================================
      # VALIDATE PRIVATE KEY
      # ========================================================
      #
      # No hacemos diff de los PEM porque diferencias de
      # formato/saltos de línea pueden provocar falsos errores.
      #
      # ========================================================
      - name: Validate JWT private key
        run: |
          set -e

          openssl rsa \
            -in ci-keys/auth/jwt-private.pem \
            -check \
            -noout

          echo "JWT private key is valid."


      # ========================================================
      # BUILD DOCKER IMAGES
      # ========================================================
      #
      # IMPORTANTE:
      #
      # Los Dockerfiles NO ejecutan composer install.
      #
      # Composer se ejecutará posteriormente dentro del
      # contenedor, cuando .env y las claves JWT ya existan.
      #
      # ========================================================
      - name: Build Docker images
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            build


      # ========================================================
      # START DOCKER SERVICES
      # ========================================================
      - name: Start Docker services
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            up -d


      # ========================================================
      # SHOW CONTAINERS
      # ========================================================
      - name: Docker containers
        run: |
          docker compose \
            -f docker-compose.ci.yml \
            ps


      # ========================================================
      # VERIFY JWT KEYS INSIDE AUTH CONTAINER
      # ========================================================
      - name: Verify Auth JWT keys
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            sh -c '
              echo "Current directory:"
              pwd

              echo "Storage:"
              ls -la /var/www/html/storage

              echo "JWT keys:"
              ls -la /var/www/html/storage/keys

              test -f /var/www/html/storage/keys/jwt-private.pem
              test -f /var/www/html/storage/keys/jwt-public.pem
            '

          echo "Auth JWT keys are available."


      # ========================================================
      # VERIFY JWT KEY INSIDE TASK CONTAINER
      # ========================================================
      - name: Verify Task JWT key
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            sh -c '
              echo "Current directory:"
              pwd

              echo "Storage:"
              ls -la /var/www/html/storage

              echo "JWT keys:"
              ls -la /var/www/html/storage/keys

              test -f /var/www/html/storage/keys/jwt-public.pem
            '

          echo "Task JWT public key is available."


      # ========================================================
      # CREATE AUTH .ENV
      # ========================================================
      - name: Create Auth .env
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            sh -c 'cat > /var/www/html/.env <<EOF
          APP_NAME=AuthService
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost

          LOG_CHANNEL=stderr
          LOG_LEVEL=debug

          DB_CONNECTION=pgsql
          DB_HOST=db_server1
          DB_PORT=5432
          DB_DATABASE=auth_db
          DB_USERNAME=root
          DB_PASSWORD=root

          JWT_ALGO=RS256
          JWT_TTL=60
          JWT_PASSPHRASE=
          JWT_ISSUER=auth-service
          EOF'

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            sh -c 'test -f /var/www/html/.env'

          echo "Auth .env created."


      # ========================================================
      # CREATE TASK .ENV
      # ========================================================
      - name: Create Task .env
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            sh -c 'cat > /var/www/html/.env <<EOF
          APP_NAME=TaskService
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost

          LOG_CHANNEL=stderr
          LOG_LEVEL=debug

          DB_CONNECTION=mysql
          DB_HOST=db_server3
          DB_PORT=3306
          DB_DATABASE=task_db
          DB_USERNAME=root
          DB_PASSWORD=root

          JWT_ALGO=RS256
          JWT_TTL=60
          JWT_ISSUER=auth-service
          EOF'

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            sh -c 'test -f /var/www/html/.env'

          echo "Task .env created."


      # ========================================================
      # INSTALL AUTH COMPOSER DEPENDENCIES
      # ========================================================
      #
      # En este momento ya existen:
      #
      #   /var/www/html/.env
      #   /var/www/html/storage/keys/jwt-private.pem
      #   /var/www/html/storage/keys/jwt-public.pem
      #
      # Por tanto Laravel puede cargar config/jwt.php.
      #
      # ========================================================
      - name: Install Auth dependencies
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --optimize-autoloader


      # ========================================================
      # INSTALL TASK COMPOSER DEPENDENCIES
      # ========================================================
      - name: Install Task dependencies
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --optimize-autoloader


      # ========================================================
      # GENERATE AUTH APP KEY
      # ========================================================
      - name: Generate Auth APP_KEY
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            php artisan key:generate --force


      # ========================================================
      # GENERATE TASK APP KEY
      # ========================================================
      - name: Generate Task APP_KEY
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            php artisan key:generate --force


      # ========================================================
      # CLEAR LARAVEL CACHE
      # ========================================================
      - name: Clear Laravel cache
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            php artisan optimize:clear

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            php artisan optimize:clear


      # ========================================================
      # AUTH MIGRATION STATUS
      # ========================================================
      - name: Auth migration status
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            php artisan migrate:status


      # ========================================================
      # AUTH MIGRATIONS
      # ========================================================
      - name: Auth migrations
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            php artisan migrate --force


      # ========================================================
      # TASK MIGRATION STATUS
      # ========================================================
      - name: Task migration status
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            php artisan migrate:status


      # ========================================================
      # TASK MIGRATIONS
      # ========================================================
      - name: Task migrations
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            php artisan migrate --force


      # ========================================================
      # AUTH TESTS
      # ========================================================
      - name: Run Auth tests
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            php artisan test -v


      # ========================================================
      # TASK TESTS
      # ========================================================
      - name: Run Task tests
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            php artisan test -v


      # ========================================================
      # INSTALL REACT DEPENDENCIES
      # ========================================================
      - name: Install React dependencies
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T react-auth \
            npm ci


      # ========================================================
      # BUILD REACT
      # ========================================================
      - name: Build React
        run: |
          set -e

          docker compose \
            -f docker-compose.ci.yml \
            exec -T react-auth \
            npm run build


      # ========================================================
      # SHOW LOGS IF SOMETHING FAILS
      # ========================================================
      - name: Show Docker logs
        if: failure()
        run: |

          echo "=========================================="
          echo "DOCKER CONTAINERS"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            ps

          echo "=========================================="
          echo "AUTH SERVICE"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            logs auth-service

          echo "=========================================="
          echo "TASK SERVICE"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            logs task-service

          echo "=========================================="
          echo "POSTGRES"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            logs db_server1

          echo "=========================================="
          echo "MYSQL"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            logs db_server3

          echo "=========================================="
          echo "REACT"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            logs react-auth

          echo "=========================================="
          echo "AUTH LARAVEL LOG"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            exec -T auth-service \
            sh -c 'cat storage/logs/laravel.log 2>/dev/null || true'

          echo "=========================================="
          echo "TASK LARAVEL LOG"
          echo "=========================================="

          docker compose \
            -f docker-compose.ci.yml \
            exec -T task-service \
            sh -c 'cat storage/logs/laravel.log 2>/dev/null || true'


      # ========================================================
      # CLEANUP
      # ========================================================
      - name: Shutdown
        if: always()
        run: |

          docker compose \
            -f docker-compose.ci.yml \
            down -v

          rm -rf ci-keys